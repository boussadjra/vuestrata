services:
  app:
    build: .
    ports:
      - '${APP_PORT:-8080}:8080'
    # What THIS container is started with. The image is the same for every
    # environment: these are read at start, by the image's entrypoint, and win
    # over the values the build inlined. A name with no value is passed through
    # from the shell or the .env file beside this file, and left unset when it
    # is not there, so the image's own default applies.
    #   VUESTRATA_API_URL=https://api.staging.example.com docker compose up
    # A value may hold only URL-safe characters (no spaces or quotes); the
    # container refuses to start otherwise. Variables your deploy.config.ts
    # lists under `runtime`, `connectSrcFromEnv` or `websocketFromEnv` go here
    # too.
    environment:
      - VUESTRATA_API_URL
      - VUESTRATA_APP_TITLE
      - VUESTRATA_ERROR_REPORTING_DSN
      - VUESTRATA_RELEASE
      - VUESTRATA_SESSION_PERSISTENCE
    restart: unless-stopped
    read_only: true
    # /tmp is the one path the container writes to: nginx-unprivileged keeps its
    # pid and temp files there, and the entrypoint renders /tmp/vuestrata. The
    # other two cost nothing and keep a stock nginx.conf working.
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - vuestrata

networks:
  vuestrata:
    driver: bridge
