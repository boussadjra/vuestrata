name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published queries run against unchanged code. Most
    # vulnerabilities are found after the code was written, not during review.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity queries that the default suite
          # omits; worth the extra runtime for a template others build on.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
