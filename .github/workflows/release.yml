name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: '20'

      - run: vp check
      - run: vp test --run
      - run: vp build
      - run: tar -czf "vuestrata-${{ github.ref_name }}.tar.gz" dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            vuestrata-${{ github.ref_name }}.tar.gz
