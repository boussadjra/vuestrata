name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Full gate before anything is published. Previously the release job ran only
  # `vp check` + `vpr test`, so a tag could ship an artifact that no e2e run and
  # no bundle verification had ever seen.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # Turns on test/unit/architecture/public-surface.test.ts, which snapshots
      # this repository's own modules and permissions. Empty in a project built
      # from the template, which would fail it on its first `add module`.
      VUESTRATA_MAINTAINER: ${{ github.repository == 'boussadjra/vuestrata' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, which brings the earlier release tags. The migration
          # tests compare against what each tag shipped, and fail here without them.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: ${{ env.NODE_VERSION }}

      - run: vp check
      - run: node scripts/lint/run-custom-rules.mjs
      - run: node scripts/msw/check-worker-version.mjs
      # The shipped lockfile and CLI payload describe THIS release. Both go
      # stale silently: nothing errors, projects just stop receiving updates.
      # Neither was checked by any workflow before a tag was pushed.
      - name: Maintainer gates (template lock, CLI payload)
        if: github.repository == 'boussadjra/vuestrata'
        run: vpr lint:maintainer
      - run: vpr test --run

  smoke:
    name: Production smoke tests
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: ${{ env.NODE_VERSION }}
      - run: vp exec playwright install --with-deps chromium

      # Against the built artifact, not the dev server. A release must not be
      # publishable when the thing being released does not boot.
      - name: E2E against the production preview
        env:
          E2E_TARGET: preview
        run: vpr test:e2e --project=chromium

      - name: Session authentication against the stub backend
        if: github.repository == 'boussadjra/vuestrata'
        run: vpr test:e2e:session

      - uses: actions/upload-artifact@v4
        if: failure() && github.repository == 'boussadjra/vuestrata'
        with:
          name: release-session-test-results
          path: test-results/integration/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-playwright-report
          path: playwright-report/

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Build production artifact
        env:
          VUESTRATA_RUNTIME_MODE: production
          VUESTRATA_USE_MOCKS: 'false'
          VUESTRATA_AUTH_ADAPTER: jwt
          VUESTRATA_API_URL: /api
          VUESTRATA_RELEASE: ${{ github.ref_name }}
        run: vp build

      - name: Verify bundle invariants
        run: node scripts/build/verify-bundle.mjs --mode=production

      # Belt-and-braces: production builds emit none, but a published tarball
      # must never contain sourcemaps — they hand over the full original source.
      - name: Strip any sourcemaps
        run: find dist -name '*.map' -type f -delete

      - run: tar -czf "vuestrata-${{ github.ref_name }}.tar.gz" dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            vuestrata-${{ github.ref_name }}.tar.gz
