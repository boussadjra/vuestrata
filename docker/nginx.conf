# GENERATED by scripts/security/sync-headers.mjs — do not edit by hand.
# Edit scripts/security/headers.mjs and run `vpr security:headers`.

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Applies to responses served by this level directly (errors, redirects).
  # Every location below re-includes it — see the note in the snippet.
  #
  # It is read from /tmp/vuestrata, where the entrypoint renders it from the
  # container's environment (docker/entrypoint.d/40-vuestrata-runtime.sh). A
  # container whose entrypoint did not run has no such file, and nginx refuses
  # to start rather than serve the app without its headers.
  include /tmp/vuestrata/security-headers.conf;

  # The image gzips its text assets once, at build time, and gzip_static sends
  # those .gz files as they are; `gzip` compresses the rest on the fly.
  # `gzip_proxied any` keeps both on behind a load balancer: by default nginx
  # compresses nothing for a request that arrives with a Via header.
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;

  # Liveness and readiness probe. nginx answers it alone, so it reports whether
  # the server is up without fetching the app, and stays out of an access log a
  # probe every few seconds would otherwise fill.
  location = /healthz {
    access_log off;
    default_type text/plain;
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 "ok";
  }

  # The answer to a same-origin API path that nothing routes: a JSON 502
  # instead of the SPA fallback. Whether there is one, and at which path,
  # follows VUESTRATA_API_URL in the container environment, so the
  # entrypoint writes this file (docker/runtime/api-location.conf.template).
  include /tmp/vuestrata/api-location.conf;

  # Names every hashed asset, so it is revalidated on every load: a cached copy
  # would keep a returning user on the previous deploy.
  location = /index.html {
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Content-hashed by the build: a changed file gets a new name, so a cached copy
  # can never go stale. Nothing else is safe to cache forever.
  location ^~ /assets/ {
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fetched to notice that a newer build is live; a cached copy would hide it.
  location = /version.json {
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # Written per environment rather than per build, under a name that never
  # changes, so no cache may keep a copy.
  location = /runtime-config.js {
    alias /tmp/vuestrata/runtime-config.js;
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # Not content-hashed and controls every request in the demo build — a cached
  # copy would keep serving stale mock handlers after a deploy. A production
  # build deletes the file, leaving this rule nothing to apply to.
  location = /mockServiceWorker.js {
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }

  # Every other file: the favicon, robots.txt, the manifest, images. None is
  # hashed, so an hour rather than forever: a replaced favicon reaches returning
  # users the same day. An SPA route is not served from here: try_files hands
  # it to /index.html, which has its own block.
  location / {
    try_files $uri $uri/ /index.html;
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }

  # Scripts, stylesheets, images and fonts get the same hour, but a missing one
  # is a 404: through the fallback above, a stale image link or a removed script
  # would get index.html with a 200, and nothing would look broken. A matching
  # regex beats the `/` prefix; the exact and ^~ locations still beat the regex.
  location ~* \.(?:js|mjs|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf)$ {
    try_files $uri =404;
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }

  # The web app manifest, under the type its specification gives it: without
  # this block it is served as application/octet-stream. Cached for the same
  # hour, and a missing one is a 404 like any other file.
  location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
    include /tmp/vuestrata/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }
}
